<h2>Exercice 1 : Color</h2>

<div class="card p-4 shadow-sm">
  <!-- Le fond du div suit le signal "couleur" -->
  <div class="boite mb-3" [style.backgroundColor]="couleur()"></div>

  <div class="d-flex gap-2">
    <!-- #inputCouleur : on donne un nom à cet input pour le réutiliser -->
    <input
      #inputCouleur
      type="text"
      class="form-control"
      placeholder="Tape une couleur : red, green, #ff9900..."
      (input)="changerCouleur(inputCouleur.value)"
    />

    <!-- On passe l'input à la fonction pour pouvoir le vider -->
    <button class="btn btn-secondary" (click)="reinitialiser(inputCouleur)">
      Couleur par défaut
    </button>
  </div>

  <p class="mt-3 mb-0">Couleur actuelle : <strong>{{ couleur() }}</strong></p>
</div>
