<label>Name :</label>
<input #name type="text" class="form-control" />

<label>Content :</label>
<input #content type="text" class="form-control" />

<button class="btn btn-primary" (click)="addTodo(name.value, content.value)">
  Add Todo
</button>

<ul>
  @for (todo of todos(); track $index) {
    <li>
      {{ todo.name }} : {{ todo.content }}
      <button class="btn btn-danger" (click)="deleteTodo(todo)">Delete</button>
    </li>
  }
</ul>
